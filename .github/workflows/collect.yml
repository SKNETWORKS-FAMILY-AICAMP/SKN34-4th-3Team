# 매주 수집 스크립트(DB/run_collection.py)를 App EC2 에서 실행하고 RAG 인덱스를 갱신한다.
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY (deploy.yml 과 동일)
# schedule 은 기본 브랜치(main)에 있는 workflow 만 실행된다.
name: collect-data

on:
  schedule:
    - cron: "0 18 * * 0"   # UTC. 매주 월요일 03:00 KST
  workflow_dispatch:

# 서버 변경 작업은 같은 그룹에서 대기 취소 없이 직렬 실행한다.
concurrency:
  group: ec2-app
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 110m
          script: |
            set -e
            exec 9>"$HOME/.ec2-app.lock"
            flock -w 300 9 || { echo "::error::서버 작업 잠금 대기 시간 초과"; exit 1; }
            active_collectors=$(docker ps -q --filter label=com.docker.compose.service=collector)
            [ -z "$active_collectors" ] || { echo "::error::이전 collector가 실행 중입니다"; exit 1; }
            cd ~/SKN34-4th-3Team
            git pull --ff-only origin main || { echo "::error::git pull 실패"; exit 1; }
            # 일부 수집이 실패해도 성공한 데이터는 임베딩·ES 에 반영하고, 실패는 마지막에 알린다.
            collect_rc=0
            docker compose -f docker-compose.app.yml run --rm collector || collect_rc=$?
            # 신규·변경 청크만 임베딩해 pgvector 에 저장한 뒤 ES 를 재색인한다.
            # reindex 가 실패해도 수집 결과(collect_rc)를 잃지 않도록 따로 받는다.
            reindex_rc=0
            docker compose -f docker-compose.app.yml exec -T llm \
              curl -fsS --max-time 1800 -X POST localhost:8001/rag/reindex \
              -H 'Content-Type: application/json' -d '{"documentIds":[],"force":false}' || reindex_rc=$?
            [ "$collect_rc" -ne 0 ] && echo "::error::수집 실패(rc=$collect_rc)"
            [ "$reindex_rc" -ne 0 ] && echo "::error::reindex 실패(rc=$reindex_rc)"
            [ "$collect_rc" -eq 0 ] && [ "$reindex_rc" -eq 0 ]
