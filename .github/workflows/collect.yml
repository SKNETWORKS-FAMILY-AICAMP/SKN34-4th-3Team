# 매주 수집 스크립트(DB/run_collection.py)를 App EC2 에서 실행하고 RAG 인덱스를 갱신한다.
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY (deploy.yml 과 동일)
# schedule 은 기본 브랜치(main)에 있는 workflow 만 실행된다.
name: collect-data

on:
  schedule:
    - cron: "0 18 * * 0"   # UTC. 매주 월요일 03:00 KST
  workflow_dispatch:

# deploy.yml 과 같은 그룹이라 배포·수집이 동시에 돌지 않는다.
concurrency:
  group: ec2-app
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 110m
          script: |
            set -e
            cd ~/SKN34-4th-3Team
            docker compose -f docker-compose.app.yml run --rm collector
            # 수집은 원본 테이블만 갱신한다. 임베딩·ES 반영은 reindex 가 맡는다.
            docker compose -f docker-compose.app.yml exec -T llm \
              curl -fsS --max-time 1800 -X POST localhost:8001/rag/reindex \
              -H 'Content-Type: application/json' -d '{"documentIds":[]}'
