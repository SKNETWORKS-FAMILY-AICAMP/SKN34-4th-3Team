# main 병합 시 테스트 후 AWS App EC2 에 배포한다.
# 필요한 Secrets: EC2_HOST(App EC2 Elastic IP), EC2_USER, EC2_SSH_KEY
# 서버 준비 절차: Docs/AWS_DEPLOY_GUIDE.md
name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - name: Backend tests
        working-directory: Backend
        env:
          TOKEN_SECRET: "ci-test-only-secret-1234567890abcdef"
        run: uv run python -m unittest discover tests

      # 사업계획서 PDF 테스트에 한글 글꼴이 필요하다(운영 이미지는 LLM/Dockerfile 에서 fonts-nanum 설치).
      - name: Korean font for LLM tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-nanum

      - name: LLM tests
        working-directory: LLM
        run: uv run pytest

      # LLM 이미지(paddle·PP-OCR 모델 다운로드 포함)가 운영 EC2 에서 처음 깨지지 않게 미리 빌드해 본다.
      - name: LLM image build
        run: docker build -t llm-ci ./LLM

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Frontend tests & build
        working-directory: Frontend
        run: |
          npm ci
          node --test "tests/*.test.mjs"
          npm run build

  build-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: Backend
          - service: frontend
            context: Frontend
          - service: llm
            context: LLM
          - service: presentation
            context: Presentation
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the tested revision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ matrix.service }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE:$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" "$BUILD_CONTEXT"
          docker push "$image"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-images
    permissions:
      contents: read
      packages: read
    # PR 테스트는 제외하고 서버를 변경하는 작업만 수집과 함께 순서대로 실행한다.
    concurrency:
      group: ec2-app
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          RELEASE_SHA: ${{ github.sha }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 35m
          envs: RELEASE_SHA,GHCR_REPOSITORY,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            exec 9>"$HOME/.ec2-app.lock"
            flock -w 300 9 || { echo "::error::서버 작업 잠금 대기 시간 초과"; exit 1; }
            # SSH 취소 뒤에도 Docker daemon의 collector는 남을 수 있다.
            active_collectors=$(docker ps -q --filter label=com.docker.compose.service=collector)
            [ -z "$active_collectors" ] || { echo "::error::이전 collector가 실행 중입니다"; exit 1; }
            cd ~/SKN34-4th-3Team
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
              echo '::notice::최신 main이 아닌 배포 요청을 건너뜁니다'
              exit 0
            fi
            git pull --ff-only origin main
            [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
            bash scripts/deploy_app.sh
