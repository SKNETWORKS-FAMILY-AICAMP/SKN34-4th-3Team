# AWS App EC2 전용. db·elasticsearch 는 Data EC2 의 docker-compose.data.yml 이 띄운다.
# 로컬 개발·학원 내부망 배포는 기존 docker-compose.yml 을 쓴다.
#   docker compose -f docker-compose.app.yml run --rm db-migrate
#   docker compose -f docker-compose.app.yml pull backend frontend llm
#   docker compose -f docker-compose.app.yml up -d --no-build
# 발표자료(/ppt/)까지 띄우려면 .env 에 COMPOSE_PROFILES=presentation 을 둔다.
# 절차: Docs/AWS_DEPLOY_GUIDE.md
# 컨테이너 로그(json-file)가 디스크를 채우지 않게 서비스마다 10MB x 3개로 제한한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *default-logging
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY(GHCR 이미지 경로)가 필요하다}/backend:${APP_IMAGE_TAG:?APP_IMAGE_TAG(검증된 커밋 SHA)가 필요하다}
    mem_limit: ${BACKEND_MEM_LIMIT:-0}
    restart: unless-stopped
    environment:
      # date.today()·datetime.now()가 한국 날짜를 쓰게 한다(00~09시 D-day 어긋남 방지).
      TZ: Asia/Seoul
      LLM_API_URL: http://llm:8001
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${COMPOSE_DB_HOST:?COMPOSE_DB_HOST(Data EC2 private IP)가 필요하다}:${COMPOSE_DB_PORT:-5432}/${POSTGRES_DB}
      TOKEN_SECRET: ${TOKEN_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # 공개 서버라 관리자 비밀번호 없이는 기동하지 않는다. 기존 DB 의 관리자 비밀번호도 이 값으로 바뀐다.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD(관리자 비밀번호)가 필요하다}
    # 소스 bind mount 없이 이미지만으로 실행한다. 8000 은 호스트에 열지 않는다(nginx 가 /api 로 넘긴다).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    # db·elasticsearch 는 다른 호스트라 compose 의존성으로 기다릴 수 없다. llm healthcheck 재시도에 맡긴다.
    depends_on:
      llm:
        condition: service_healthy

  frontend:
    logging: *default-logging
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY가 필요하다}/frontend:${APP_IMAGE_TAG:?APP_IMAGE_TAG가 필요하다}
    mem_limit: ${FRONTEND_MEM_LIMIT:-0}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  presentation:
    logging: *default-logging
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY가 필요하다}/presentation:${APP_IMAGE_TAG:?APP_IMAGE_TAG가 필요하다}
    mem_limit: ${PRESENTATION_MEM_LIMIT:-0}
    profiles: ["presentation"]
    restart: unless-stopped

  llm:
    logging: *default-logging
    image: ${APP_IMAGE_REGISTRY:?APP_IMAGE_REGISTRY가 필요하다}/llm:${APP_IMAGE_TAG:?APP_IMAGE_TAG가 필요하다}
    mem_limit: ${LLM_MEM_LIMIT:?운영 실측 후 LLM_MEM_LIMIT을 지정해야 한다}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # date.today()·datetime.now()가 한국 날짜를 쓰게 한다(00~09시 D-day 어긋남 방지).
      TZ: Asia/Seoul
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${COMPOSE_DB_HOST:?COMPOSE_DB_HOST(Data EC2 private IP)가 필요하다}:${COMPOSE_DB_PORT:-5432}/${POSTGRES_DB}
      VECTOR_STORE_BACKEND: postgres
      # Postgres 와 같은 Data EC2 에 있다.
      ELASTICSEARCH_URL: http://${COMPOSE_DB_HOST}:${COMPOSE_ES_PORT:-9200}
      PORT: 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 배포마다 app_extras.sql 을 Data EC2 의 DB 에 다시 적용한다(전 문장 재실행 안전).
  # up 으로는 뜨지 않고 run --rm db-migrate 로만 실행한다.
  db-migrate:
    logging: *default-logging
    image: pgvector/pgvector:pg16
    profiles: ["migrate"]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./DB/app_extras.sql:/app_extras.sql:ro
    command: ["psql", "-h", "${COMPOSE_DB_HOST:?COMPOSE_DB_HOST(Data EC2 private IP)가 필요하다}", "-p", "${COMPOSE_DB_PORT:-5432}", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/app_extras.sql"]

  # 수집 스크립트(DB/run_collection.py)를 Data EC2 의 DB 에 실행한다.
  # up 으로는 뜨지 않고 run --rm collector 로만 실행한다(.github/workflows/collect.yml).
  collector:
    logging: *default-logging
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["collector"]
    restart: "no"
    mem_limit: ${COLLECTOR_MEM_LIMIT:-0}
    env_file:
      - .env
    environment:
      # date.today()·datetime.now()가 한국 날짜를 쓰게 한다(00~09시 D-day 어긋남 방지).
      TZ: Asia/Seoul
      DB_HOST: ${COMPOSE_DB_HOST:?COMPOSE_DB_HOST(Data EC2 private IP)가 필요하다}
      DB_PORT: ${COMPOSE_DB_PORT:-5432}
      # 바인드 마운트한 DB/ 안에 .venv 를 만들지 않는다.
      UV_PROJECT_ENVIRONMENT: /opt/db-venv
      # 터미널 없이(Actions SSH) 실행해도 print 가 바로 로그에 찍히게 한다.
      PYTHONUNBUFFERED: "1"
    working_dir: /app
    volumes:
      - ./DB:/app:ro
    command: ["uv", "run", "--frozen", "python", "run_collection.py"]
