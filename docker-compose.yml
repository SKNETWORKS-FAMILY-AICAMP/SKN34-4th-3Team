services:
  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      LLM_API_URL: http://llm:8001
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${COMPOSE_DB_HOST:-db}:${COMPOSE_DB_PORT:-5432}/${POSTGRES_DB}
      TOKEN_SECRET: ${TOKEN_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    healthcheck:
      # 이미지에 curl 이 없다. /health 는 LLM·Postgres 상태까지 조회해 수 초 걸릴 수 있어 timeout 을 넉넉히 둔다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      llm:
        condition: service_healthy

  # 배포 전용. 로컬 개발은 Vite(:5173)를 쓰므로 프로필 없이는 빌드도 기동도 하지 않는다.
  # 서버에서는 docker compose --profile frontend up -d --build 로 띄운다.
  frontend:
    build:
      context: ./Frontend
    profiles: ["frontend"]
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # 발표자료(Slidev) 전용. 다른 서비스와 무관한 정적 사이트라 의존성이 없다.
  # frontend nginx 가 /ppt/ 로 프록시하므로 포트를 직접 열지 않는다.
  # 발표 때는 docker compose --profile frontend --profile presentation up -d --build 로 함께 띄운다.
  presentation:
    build:
      context: ./Presentation
    profiles: ["presentation"]
    restart: unless-stopped

  llm:
    build:
      context: ./LLM
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${COMPOSE_DB_HOST:-db}:${COMPOSE_DB_PORT:-5432}/${POSTGRES_DB}
      VECTOR_STORE_BACKEND: postgres
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./LLM:/app
    healthcheck:
      # 이미지에 curl 이 없다. python:3.13-slim 의 기본 python 으로 확인한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: startup_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./DB/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./DB/app_extras.sql:/docker-entrypoint-initdb.d/02_app_extras.sql:ro
    healthcheck:
      # initdb 중 임시 서버는 TCP를 열지 않는다. TCP로 확인해야 init이 끝난 뒤에만 healthy가 되고
      # db-migrate(-h db 접속)가 연결 거부로 실패하지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 기동할 때마다 app_extras.sql 을 다시 적용한다. initdb 는 볼륨이 비어 있을 때만 돌아
  # 기존 볼륨에는 스키마 변경이 반영되지 않기 때문이다. 전 문장이 재실행 안전하다.
  db-migrate:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./DB/app_extras.sql:/app_extras.sql:ro
    command: ["psql", "-h", "db", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/app_extras.sql"]
    depends_on:
      db:
        condition: service_healthy

  elasticsearch:
    build: ./elasticsearch
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db_data:
  elasticsearch_data:
