# 배포용 설정. 화면과 API 를 같은 출처에서 서빙해 Frontend 소스를 고치지 않는다.
# 개발 중 Vite 가 하던 일(vite.config.js 의 /api 프록시)을 그대로 옮겨 온 것이다.
server {
    listen 80;
    server_name _;

    # proxy_pass 끝의 슬래시가 /api 접두사를 벗긴다. vite.config.js 의 rewrite 와 같은 결과다.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 세무 질문은 Backend 가 LLM 응답을 최대 120s 까지 기다린다
        # (core/config.py 의 LLM_TIMEOUT_CHAT_TAX). nginx 가 먼저 끊으면 안 된다.
        proxy_read_timeout 180s;
    }

    # 발표자료(Slidev). 정적 사이트라 presentation 컨테이너로 그대로 넘긴다.
    # absolute_redirect off: 호스트 포트가 80 이 아닐 때 리다이렉트에서 포트가 빠지는 문제를 피한다.
    location = /ppt { absolute_redirect off; return 301 /ppt/; }

    location /ppt/ {
        # presentation 프로필을 띄우지 않아도 frontend 는 기동해야 한다. 업스트림을 변수로 두면
        # nginx 기동 시점이 아니라 요청 시점에 Docker 내장 DNS(127.0.0.11) 로 이름을 찾는다.
        resolver 127.0.0.11 valid=10s;
        set $presentation_host presentation;
        # 변수 proxy_pass 는 뒤에 URI 를 붙여 접두사를 벗기는 방식을 쓸 수 없어 rewrite 로 처리한다.
        rewrite ^/ppt/(.*)$ /$1 break;
        proxy_pass http://$presentation_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
