    # Preserve the API proxy path and request limits.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_host backend;
        client_max_body_size 16m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # Slidev presentation service.
    location = /ppt { absolute_redirect off; return 301 /ppt/; }

    location /ppt/ {
        resolver 127.0.0.11 valid=10s;
        set $presentation_host presentation;
        rewrite ^/ppt/(.*)$ /$1 break;
        proxy_pass http://$presentation_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PWA resources must be revalidated so new deployments are detected.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Vite asset names are content-hashed.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
