# AWS HTTPS configuration. The actual domain comes from the request Host header.
server {
    listen 80;
    server_name _;

    # Serve Certbot webroot challenges directly over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/changeup/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/changeup/privkey.pem;

    include /etc/nginx/snippets/app-locations.conf;
}
